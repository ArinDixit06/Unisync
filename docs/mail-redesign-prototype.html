<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniSync Mail Redesign Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f8f8f7;
        --surface: #ffffff;
        --border: rgba(15, 23, 42, 0.12);
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f766e;
        --radius: 16px;
        font-family: Inter, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      .shell {
        display: grid;
        grid-template-columns: 260px minmax(360px, 1fr) minmax(360px, 42%);
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      header {
        grid-column: 2 / 4;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 16px 24px;
      }
      aside {
        grid-row: 1 / 3;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 24px;
      }
      .list {
        border-right: 1px solid var(--border);
        overflow: auto;
        background: rgba(255, 255, 255, 0.7);
      }
      .preview {
        overflow: auto;
        background: rgba(255, 255, 255, 0.7);
      }
      .mail-row {
        display: grid;
        grid-template-columns: 32px 1fr auto;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 14px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <strong>UniSync</strong>
        <div style="margin-top: 24px" class="pill">Compose</div>
      </aside>
      <header>
        <div class="search">Search mail, sender or subject</div>
      </header>
      <section class="list">
        <div class="mail-row">
          <div>AR</div>
          <div>
            <div><strong>Arin</strong> · Project update</div>
            <div style="color: var(--muted); font-size: 12px">Quick update on the roadmap...</div>
          </div>
          <div style="font-size: 12px; color: var(--muted)">2h</div>
        </div>
        <div class="mail-row">
          <div>LC</div>
          <div>
            <div><strong>Legal</strong> · Contract review</div>
            <div style="color: var(--muted); font-size: 12px">Please review the attached...</div>
          </div>
          <div style="font-size: 12px; color: var(--muted)">Yesterday</div>
        </div>
      </section>
      <section class="preview" style="padding: 24px">
        <h2>Project update</h2>
        <p style="color: var(--muted)">Arin &lt;arin@unisync.app&gt;</p>
        <div style="margin-top: 16px" class="pill">Reply</div>
        <div style="margin-top: 24px">This is the preview panel.</div>
      </section>
    </div>
  </body>
</html>
